## RTAB-Map params for the Intel Sys mecanum rover.
# Fuses: Unitree L2 3D LiDAR (scan_cloud) + RealSense RGB-D camera for loop
# closure and 2D/3D mapping. Odometry is normally NOT computed here — by default
# (odometry:=point_lio) it comes from Point-LIO (tightly-coupled LiDAR-inertial,
# launched via localization.launch.py), and rtabmap consumes its /odom +
# odom->base_footprint TF. The icp_odometry block below is only used by the
# opt-in fallback (odometry:=icp): LiDAR-only ICP, no IMU, drifts in pitch on this
# rig (narrow L2 vertical FOV) and tilts the map — for quick tests only.

icp_odometry:
  ros__parameters:
    # Used ONLY when rtabmap.launch.py is run with odometry:=icp (fallback).
    # icp_odometry has NO RGB-D subscription — it is LiDAR-only, so the camera
    # does not assist pose tracking here. Prefer Point-LIO (the default).
    Reg/Strategy: "1"                # ICP (the only registration this node can do)

    Icp/VoxelSize: "0.05"
    Icp/PointToPlane: "true"
    Icp/PointToPlaneK: "20"
    Icp/PointToPlaneRadius: "0.0"
    Icp/Iterations: "30"
    Icp/Epsilon: "0.001"
    Icp/MaxCorrespondenceDistance: "0.5"   # ~10x voxel size, standard rule of thumb
    Icp/CorrespondenceRatio: "0.01"        # lower than default 0.1 — this LiDAR's
                                            # scans are sparser than the dense RGBD
                                            # clouds rtabmap's defaults assume
    Icp/MaxTranslation: "1.0"              # reject a frame-to-frame jump bigger than
    Icp/MaxRotation: "0.78"                # this instead of accepting a bad match
    Icp/Strategy: "1"                      # libpointmatcher

    Odom/Strategy: "0"               # Frame-to-Map (more stable than frame-to-frame)
    Odom/ResetCountdown: "1"         # auto-reset after N consecutive failures

    frame_id: "base_footprint"
    publish_tf: true
    wait_for_transform: 0.2
    approx_sync: true
    qos: 2

rtabmap:
  ros__parameters:
    frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    subscribe_depth: true
    subscribe_rgb: true
    subscribe_scan_cloud: true
    approx_sync: true
    qos_image: 2
    qos_scan: 2

    Mem/IncrementalMemory: "true"
    Rtabmap/DetectionRate: "1"       # loop-closure detection rate (Hz)

    Reg/Strategy: "2"                # Vis+ICP — this node subscribes rgb/depth AND
                                      # scan_cloud, so the camera helps loop closure
                                      # / mapping on top of Point-LIO's odometry
    RGBD/ProximityBySpace: "true"
    RGBD/OptimizeFromGraphEnd: "false"

    # Occupancy grid (2D) / 3D map generation. 2D projected grid is always
    # published on /map; Grid/3D additionally controls whether the internal
    # representation and /octomap_* topics are a full 3D voxel map or a
    # ground-projected 2D one. Toggled by rtabmap.launch.py's three_d_map arg.
    Grid/FromDepth: "false"          # build the grid from the LiDAR cloud, not
                                      # the camera's depth image (longer range)
    Grid/CellSize: "0.05"
    Grid/RangeMax: "20.0"
    Grid/3D: "true"                  # overridden by launch arg
